services:
  postgres:
    volumes:
      - ${WEKNORA_MATH_RUNTIME_DIR:-/Volumes/extfastdata01/WeKnora-runtime/math-mastery}/postgres:/var/lib/postgresql/data

  redis:
    volumes:
      - ${WEKNORA_MATH_RUNTIME_DIR:-/Volumes/extfastdata01/WeKnora-runtime/math-mastery}/redis:/data

  docreader:
    volumes:
      - ${WEKNORA_MATH_RUNTIME_DIR:-/Volumes/extfastdata01/WeKnora-runtime/math-mastery}/docreader:/tmp/docreader

  neo4j:
    volumes:
      - ${WEKNORA_MATH_RUNTIME_DIR:-/Volumes/extfastdata01/WeKnora-runtime/math-mastery}/neo4j:/data
